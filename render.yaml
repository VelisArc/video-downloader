services:
  - type: web
    name: swiftdl-api
    runtime: docker
    region: singapore
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://swiftdownlod.online,https://www.swiftdownlod.online
      - key: MAX_INFLIGHT
        value: 2
      - key: RATE_LIMIT_PER_MIN
        value: 15
      - key: GUEST_DAILY_LIMIT
        value: 1
      - key: USER_DAILY_LIMIT
        value: 3
      - key: MONTHLY_DAILY_LIMIT
        value: 75
      - key: LIFETIME_DAILY_LIMIT
        value: 150
      - key: INFO_CACHE_TTL_SEC
        value: "15"
      - key: YTDLP_COOKIES_B64
        sync: false
      - key: YTDLP_PROXY
        sync: false
      - key: PREMIUM_COOKIE_VAULT_LIMIT
        value: "10"
      - key: FIREBASE_ADMIN_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RZP_WEBHOOK_SECRET
        sync: false
